plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.echowrite.app'
    compileSdk 35

    def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

    defaultConfig {
        applicationId = System.getenv("ANDROID_APPLICATION_ID") ?: 'com.echowrite.app'
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so', '**/libechowrite_core.so']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
